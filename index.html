<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mariana Silva — Engenharia Diagnóstica</title>
    <meta name="description" content="Engenheira Civil especializada em Engenharia Diagnóstica. Vistorias, inspeções prediais e laudos técnicos em Uberaba e região. Diagnóstico preciso para construções mais seguras." />
    <meta name="theme-color" content="#2F6F4E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" type="image/webp" href="/profissional-640.webp" fetchpriority="high" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <script>
      document.documentElement.classList.add('dark')
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // ID da conta do Google Ads — formato 'AW-123456789'. Preencher junto com
      // GOOGLE_ADS_CONVERSION em src/lib/gtag.js quando a campanha for criada.
      // Vazio = só o GA4 roda, sem erro.
      window.GOOGLE_ADS_ID = ''

      // A fila do dataLayer e window.gtag são definidas já no parse do HTML, antes
      // do script do Google carregar. Assim um clique no WhatsApp nos primeiros
      // segundos entra na fila e é enviado depois, em vez de ser perdido.
      window.dataLayer = window.dataLayer || []
      window.gtag = function () { window.dataLayer.push(arguments) }
      window.gtag('js', new Date())
      window.gtag('config', 'G-NRSS07DLMQ')
      if (window.GOOGLE_ADS_ID) window.gtag('config', window.GOOGLE_ADS_ID)

      // O download do gtag.js continua adiado até o load, pra não competir com a
      // renderização do site.
      window.addEventListener('load', function () {
        var s = document.createElement('script')
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-NRSS07DLMQ'
        s.async = true
        document.head.appendChild(s)
      })
    </script>
  </body>
</html>
